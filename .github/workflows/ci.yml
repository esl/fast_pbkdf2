name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:

  Ubuntu:
    name: OTP ${{matrix.otp}} / rebar3 ${{matrix.rebar3}} / OS ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-24.04']
        otp: ['29', '28', '27']
        rebar3: ['3.27.0']
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          rebar3-version: ${{matrix.rebar3}}
      # caches
      - name: Restore _build
        uses: actions/cache@v4
        with:
          path: _build
          key: _build-cache-for-os-${{matrix.os}}-otp-${{matrix.otp}}-rebar3-${{matrix.rebar3}}-hash-${{hashFiles('rebar.lock')}}
      - name: Restore rebar3's cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/rebar3
          key: rebar3-cache-for-os-${{matrix.os}}-otp-${{matrix.otp}}-rebar3-${{matrix.rebar3}}-hash-${{hashFiles('rebar.lock')}}
      # tests
      - run: rebar3 as test get-deps
      - run: rebar3 as test compile
      - run: rebar3 as test ct
      - run: rebar3 dialyzer
        if: ${{ matrix.otp == '29' && matrix.os == 'ubuntu-24.04' }}
      - name: Run coverage
        if: ${{ matrix.otp == '29' && matrix.os == 'ubuntu-24.04' }}
        run: |
          rebar3 as test codecov analyze
          gcov -o c_src fast_pbkdf2
      - name: Upload coverage reports to Codecov
        if: ${{ matrix.otp == '29' && matrix.os == 'ubuntu-24.04' }}
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  Sanitizers:
    name: Sanitizers / OTP ${{matrix.otp}} / rebar3 ${{matrix.rebar3}} / OS ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-26.04']
        otp: ['29']
        rebar3: ['3.27']
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          rebar3-version: ${{matrix.rebar3}}
      # Older ASan runtimes can randomly crash on startup with the high mmap ASLR entropy of
      # recent kernels, and the image ships older GCC versions too
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: rebar3 as test get-deps
      - run: rebar3 as test compile
        env:
          CFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g
          LDFLAGS: -fsanitize=address,undefined
      # The BEAM is not instrumented, so the sanitizer runtimes are preloaded into it. They also
      # get preloaded into every helper program started by rebar3 and the BEAM (cp, inet_gethost,
      # ...), which leak by design, so leak detection is left to the next step.
      - name: Run tests under ASan and UBSan
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so) $(gcc -print-file-name=libubsan.so)"
          rebar3 as test ct
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      # Leaks don't change exit codes here, instead the step fails on any report involving the NIF
      - name: Check for leaks with LSan
        run: |
          mkdir -p "$SANITIZER_LOGS"
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so) $(gcc -print-file-name=libubsan.so)"
          rebar3 as test ct
          unset LD_PRELOAD
          if grep -ls fast_pbkdf2 "$SANITIZER_LOGS"/*; then
            grep -ls fast_pbkdf2 "$SANITIZER_LOGS"/* | xargs head -n 60
            exit 1
          fi
        env:
          SANITIZER_LOGS: ${{ runner.temp }}/sanitizer-logs
          ASAN_OPTIONS: detect_leaks=1:exitcode=0:log_path=${{ runner.temp }}/sanitizer-logs/report

  MacOS:
    name: OTP ${{matrix.otp}} / rebar3 ${{matrix.rebar3}} / OS ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: ['macos-14', 'macos-15']
        otp: ['29', '28']
        rebar3: ['3.27.0']
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          rebar3-version: ${{matrix.rebar3}}
      # The NIF is built against Homebrew's OpenSSL
      - run: brew install openssl@3
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      # caches
      - name: Restore _build
        uses: actions/cache@v4
        with:
          path: _build
          key: _build-cache-for-os-${{matrix.os}}-otp-${{matrix.otp}}-rebar3-${{matrix.rebar3}}-hash-${{hashFiles('rebar.lock')}}
      - name: Restore rebar3's cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/rebar3
          key: rebar3-cache-for-os-${{matrix.os}}-otp-${{matrix.otp}}-rebar3-${{matrix.rebar3}}-hash-${{hashFiles('rebar.lock')}}
      # tests
      - run: rebar3 as test get-deps
      - run: >
          CFLAGS="-I/opt/homebrew/opt/openssl/include"
          LDFLAGS="-L/opt/homebrew/opt/openssl/lib"
          rebar3 as test compile
      - run: rebar3 as test ct

  s390x:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Setup emulator
      run: sudo docker run --rm --privileged tonistiigi/binfmt:qemu-v10.2.3
    - name: Run build
      uses: uraimo/run-on-arch-action@v3.1.0
      with:
        arch: s390x
        distro: ubuntu24.04
        install: |
          apt-get update -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y rebar3 gcc libssl-dev
        run: rebar3 as test do get-deps, compile, ct

